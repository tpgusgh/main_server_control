<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>서버 모니터 로그인</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="login-wrap">
  <form class="card login-card" id="form" autocomplete="on">
    <h1>서버 모니터</h1>
    <p>hi.mieung.kr · 인증된 관리자만 접근할 수 있습니다.</p>
    <label for="pw">비밀번호</label>
    <input class="input" id="pw" name="password" type="password" autocomplete="current-password" required maxlength="256" autofocus>
    <div id="otpRow">
      <label for="otp">2단계 인증 코드 <span class="muted">(설정한 경우)</span></label>
      <input class="input mono" id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000">
    </div>
    <button class="btn primary" id="submit" type="submit">로그인</button>
    <div class="error" id="err" role="alert"></div>
  </form>
</div>
<script src="/static/login.js"></script>
</body>
</html>
